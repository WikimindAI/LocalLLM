<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="L3M devient LLLM puis Local LLM" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <rect width="900" height="200" rx="16" fill="url(#bg)"/>

  <!-- Boucle totale : 10 s. Repères : 0.15 = 1,5 s | 0.25 = 2,5 s | 0.35 = 3,5 s | 0.50 = 5 s -->
  <g font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace"
     font-size="92" font-weight="700" text-anchor="middle" fill="url(#txt)">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
             keyTimes="0;0.03;0.92;0.99;1" values="0;1;1;0;0"/>

    <!-- L n°1 : centre -> léger décalage -> glisse vers la gauche -->
    <text x="392" y="125">L
      <animate attributeName="x" dur="10s" repeatCount="indefinite" calcMode="spline"
               keyTimes="0;0.15;0.25;0.35;0.5;1" values="392;392;363;363;218;218"
               keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.6 0 .2 1;0 0 1 1"/>
    </text>

    <!-- "3" qui se transforme en L -->
    <text x="450" y="125" fill="#f0883e">3
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
               keyTimes="0;0.15;0.21;1" values="1;1;0;0"/>
      <animate attributeName="x" dur="10s" repeatCount="indefinite" calcMode="spline"
               keyTimes="0;0.15;0.25;1" values="450;450;421;421"
               keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1"/>
    </text>

    <!-- L n°2 (issu du 3) -->
    <text x="421" y="125" opacity="0">L
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
               keyTimes="0;0.16;0.23;1" values="0;0;1;1"/>
      <animate attributeName="x" dur="10s" repeatCount="indefinite" calcMode="spline"
               keyTimes="0;0.35;0.5;1" values="421;421;566;566"
               keySplines="0 0 1 1;.6 0 .2 1;0 0 1 1"/>
    </text>

    <!-- L n°3 (nouveau) -->
    <text x="450" y="125" opacity="0">L
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
               keyTimes="0;0.17;0.25;1" values="0;0;1;1"/>
      <animate attributeName="x" dur="10s" repeatCount="indefinite" calcMode="spline"
               keyTimes="0;0.15;0.25;0.35;0.5;1" values="450;450;479;479;624;624"
               keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.6 0 .2 1;0 0 1 1"/>
    </text>

    <!-- M -->
    <text x="508" y="125">M
      <animate attributeName="x" dur="10s" repeatCount="indefinite" calcMode="spline"
               keyTimes="0;0.15;0.25;0.35;0.5;1" values="508;508;537;537;682;682"
               keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.6 0 .2 1;0 0 1 1"/>
    </text>

    <!-- "ocal" : apparaît dans l'espace libéré -->
    <text x="276" y="125" opacity="0">o
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.38;0.43;1" values="0;0;1;1"/>
      <animate attributeName="y" dur="10s" repeatCount="indefinite" keyTimes="0;0.38;0.43;1" values="140;140;125;125"/>
    </text>
    <text x="334" y="125" opacity="0">c
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.40;0.45;1" values="0;0;1;1"/>
      <animate attributeName="y" dur="10s" repeatCount="indefinite" keyTimes="0;0.40;0.45;1" values="140;140;125;125"/>
    </text>
    <text x="392" y="125" opacity="0">a
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.42;0.47;1" values="0;0;1;1"/>
      <animate attributeName="y" dur="10s" repeatCount="indefinite" keyTimes="0;0.42;0.47;1" values="140;140;125;125"/>
    </text>
    <text x="450" y="125" opacity="0">l
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.44;0.49;1" values="0;0;1;1"/>
      <animate attributeName="y" dur="10s" repeatCount="indefinite" keyTimes="0;0.44;0.49;1" values="140;140;125;125"/>
    </text>
  </g>

  <!-- Sous-titre -->
  <text x="450" y="172" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-size="18" fill="#8b949e" opacity="0">
    Trouve les modèles que ton PC peut vraiment faire tourner.
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
             keyTimes="0;0.5;0.58;0.92;0.99;1" values="0;0;1;1;0;0"/>
  </text>
</svg>
