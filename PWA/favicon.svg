<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 26 68 68" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.s{fill:#111113}
@media (prefers-color-scheme:dark){.s{fill:#f4f4f2}}
.d,.b{transform-box:fill-box;transform-origin:center}
.d{animation:d 6s cubic-bezier(.2,.8,.2,1) infinite}
.b1{animation:b1 6s cubic-bezier(.2,.8,.2,1) infinite}
.b2{animation:b2 6s cubic-bezier(.2,.8,.2,1) infinite}
.b3{animation:b3 6s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes d{0%,22%{transform:rotate(45deg) scale(1);opacity:1}32%,82%{transform:rotate(225deg) scale(0);opacity:0}94%,100%{transform:rotate(45deg) scale(1);opacity:1}}
@keyframes b1{0%,26%{transform:translateY(0) rotate(0) scaleX(0);opacity:0}36%,62%{transform:translateY(-20px) rotate(0) scaleX(1);opacity:1}74%,80%{transform:translateY(0) rotate(45deg) scaleX(1);opacity:1}90%,100%{transform:translateY(0) rotate(45deg) scaleX(0);opacity:0}}
@keyframes b2{0%,28%{transform:translateY(0) rotate(0) scaleX(0);opacity:0}38%,62%{transform:translateY(0) rotate(0) scaleX(1);opacity:1}72%,100%{transform:translateY(0) rotate(0) scaleX(0);opacity:0}}
@keyframes b3{0%,30%{transform:translateY(0) rotate(0) scaleX(0);opacity:0}40%,62%{transform:translateY(20px) rotate(0) scaleX(1);opacity:1}74%,80%{transform:translateY(0) rotate(-45deg) scaleX(1);opacity:1}90%,100%{transform:translateY(0) rotate(-45deg) scaleX(0);opacity:0}}
@media (prefers-reduced-motion:reduce){.d,.b{animation:none}.d{transform:rotate(45deg)}.b{opacity:0}}
</style>
<rect class="s d" x="47" y="47" width="26" height="26" rx="8" transform="rotate(45 60 60)"/>
<rect class="s b b1" x="34" y="57.5" width="52" height="5" rx="2.5" opacity="0"/>
<rect class="s b b2" x="34" y="57.5" width="52" height="5" rx="2.5" opacity="0"/>
<rect class="s b b3" x="34" y="57.5" width="52" height="5" rx="2.5" opacity="0"/>
</svg>
